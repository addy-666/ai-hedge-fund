# AI Fund OS — trading configuration (schema: backend/src/aifund/config/trading_config.py, docs/02 §4).
# Copy to config/trading.yaml (git-ignored). Unknown keys are rejected; the engine will not start on any
# validation error. Secrets never go here — they belong in .env.

engine:
  account_label: vantage-demo-1
  mode: SIM                     # SIM | PAPER | DEMO | LIVE
  allow_live: false             # must be true for LIVE (re-auth in dashboard)
  magic: 26092801
  trading_day_boundary: "17:00"            # New York: the broker's rollover; follows DST (21:00/22:00 UTC)
  trading_day_timezone: America/New_York
  timezone_display: "Asia/Kolkata"
  auto_resume_after_crash: false
  bar_close_grace_s: 3
  max_deviation_points: 20

strategy:
  analyst_enabled: true         # false = deterministic baseline only (LLM outage fallback)
  baseline_enabled: false       # deterministic mtf_trend_pullback without LLM (Phase 2)
  dry_run: false                # true: decisions and risk checks run, nothing is sent (outcome DRY_RUN)
  analyst_orders: false         # G-LLM (docs/09 §7): off = the analyst decides in SHADOW (both its and the
                                #   baseline's decisions become shadow virtual trades; the baseline trades if
                                #   enabled). On outside SIM needs a sign-off: scripts/uplift_report.py
  analyst_prompt_version: 1     # agents/prompts/analyst_v<n>.j2

committee:                      # Phase 8 (docs/03 §8): specialists per setup family + a risk critic
  mode: "off"                   # "shadow": on every bar with a candidate, record what the committee would
                                #   trade (SHADOW_COMMITTEE virtual trades; compare on the Analytics page).
                                #   Never sends an order. ~2-3 extra LLM calls per candidate bar.
  specialist_prompt_version: 1  # agents/prompts/specialist_v<n>.j2
  critic_prompt_version: 1      # agents/prompts/critic_v<n>.j2
  families:                     # family -> setup tags its specialist judges (a tag in at most one family)
    trend: [mtf_trend_pullback]
    breakout: [nr7_breakout]
    reversal: [failure_test_2b, sr_fade_range]
  weights: {}                   # family -> weight in the confidence average (default 1)
  critic_penalty: {HIGH: 15, MEDIUM: 7, LOW: 0}   # confidence points per critic objection

symbols:                        # canonical -> broker symbol (Vantage uses no suffix; Exness appends "m")
  - canonical: XAUUSD
    broker: XAUUSD
    asset_class: metal
    profile: intraday_m15
    correlation_bucket: USD_INVERSE
    # Gold never trips its gates on Vantage: spread 21-28 points, spread/ATR p99 0.048 (spread_report.py).
    max_spread_points: 250
    max_spread_to_atr: 0.15
    trade_weekends: false
    session: us_cfd
  - canonical: BTCUSD
    broker: BTCUSD
    asset_class: crypto
    profile: intraday_m15
    correlation_bucket: CRYPTO
    # Vantage BTC spread is a fixed ~1,694 points ($16.94). Gates set from scripts/spread_report.py
    # (2026-06..09 export): spread/ATR p50 0.11, p90 0.26, p99 0.60. At 0.30 the gate blocks only the
    # quietest ~7% of M15 bars (a 0.10 gate blocked 56%). The points cap (~1.5x normal) catches blow-outs.
    max_spread_points: 2500
    max_spread_to_atr: 0.30
    trade_weekends: true
  - canonical: NAS100
    broker: NAS100.r        # Vantage's name (confirmed in Market Watch)
    asset_class: index
    profile: intraday_m15
    correlation_bucket: US_EQUITY
    # Vantage NAS100 spread is a fixed 180 points (1.80 index points), every hour of the day. Gates set from
    # scripts/spread_report.py (2026-06..09 export): spread/ATR p50 0.039, p90 0.064, p99 0.083, so 0.15
    # never blocks a normal bar but does catch a spread near double its worst quiet-market level. The
    # points cap (~2x normal) catches blow-outs.
    max_spread_points: 400
    max_spread_to_atr: 0.15
    trade_weekends: false
    session: us_cfd
  # EURUSD dropped 2026-09-28: on the Vantage demo its spread is ~26% of an M15 ATR (1.4 vs ~4.9 pips),
  # far above max_spread_to_atr. Revisit with a raw-spread account or on H1.

profiles:
  intraday_m15:
    trigger_tf: M15
    setup_tf: H1
    context_tfs: [H4, D1]
    bars_per_tf: 300
    require_setup: true

risk:
  risk_per_trade_pct: 0.5
  max_risk_per_trade_pct: 1.0
  confidence_threshold: 65
  confidence_risk_scaling: {at_threshold: 0.5, at_90: 1.0}
  vol_regime_scaling: {atr_pct_rank_above: 0.9, factor: 0.5}
  drawdown_scaling: {dd_pct_above: 5.0, factor: 0.5}
  stops:
    atr_tf: trigger
    k_sl_default: 1.5
    k_sl_min: 1.0
    k_sl_max: 3.0
    invalidation_buffer_atr: 0.1
    rr_default: 2.0
    rr_min: 1.2
    rr_max: 4.0
  min_lot_overshoot_pct: 0      # 0 = never upsize to volume_min
  max_lots_per_symbol: 5.0
  commission_per_lot_roundtrip: auto
  max_margin_utilisation: 0.30
  limits:
    max_open_positions: 5
    max_positions_per_symbol: 1
    max_portfolio_heat_pct: 3.0
    max_bucket_heat_pct: 1.5
    max_trades_per_symbol_per_day: 4
    daily_loss_limit_pct: 3.0
    weekly_loss_limit_pct: 6.0
    max_drawdown_pct: 10.0
    max_notional_leverage: 10
  guards:
    cooldown_bars_after_close: 2
    cooldown_bars_after_loss: 4
    block_if_foreign_position_on_symbol: true
    reversal_mode: close_only
    reversal_extra_confidence: 15
    reversal_min_hold_bars: 3
    max_reversals_per_symbol_per_day: 1
    flip_flop_window: 3
    flip_flop_lock_bars: 8
  news:
    enabled: false              # needs the Guardian EA calendar export (mql5/GuardianEA.mq5); true = fail closed without it
    blackout_minutes_before: 15
    blackout_minutes_after: 15
    impact: [HIGH]

position_management:
  break_even_at_r: null
  trailing: {mode: "off"}
  time_stop_bars: 48
  # symbols that do not trade weekends: flatten this long before any close that keeps the market shut for
  # long_close_hours or more (the weekend, Fridays and holidays that close early), and open nothing new in
  # the last no_entries_before_close_minutes before it. Close times come from the symbol's session below.
  flatten_before_close_minutes: 30
  no_entries_before_close_minutes: 60
  long_close_hours: 24

# Trading sessions (the MT5 Python API cannot read them). New York local time, so DST is automatic.
# Trading day D runs daily_open on D-1 -> daily_close on D; Sunday 18:00 -> Friday 17:00 each week.
# early_closes / closed_days come from the broker's holiday notices: KEEP THEM CURRENT. An early close that
# is not listed cannot be anticipated (2026-06-19 kept a NAS100 position over the weekend in replay).
# When unsure, list it: flattening early is the safe side.
sessions:
  us_cfd:                      # Vantage XAUUSD and NAS100.r (both close 17:00 New York)
    timezone: America/New_York
    daily_close: "17:00"
    daily_open: "18:00"
    early_closes:
      2026-06-19: "13:00"      # Juneteenth: observed in the export (last bar 16:59 UTC)
      2026-07-03: "13:00"      # Independence Day observed: observed in the export
      2026-11-27: "13:00"      # day after Thanksgiving: CONFIRM with Vantage
      2026-12-24: "13:00"      # Christmas Eve: CONFIRM with Vantage
      2026-12-31: "13:00"      # New Year's Eve: CONFIRM with Vantage
    closed_days:
      - 2026-12-25             # Christmas (a Friday): CONFIRM with Vantage
      - 2027-01-01             # New Year (a Friday): CONFIRM with Vantage
      - 2027-03-26             # Good Friday: CONFIRM with Vantage

llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  analyst_model: "<set from DeepSeek /models>"   # rejected outside SIM until set
  auditor_model: "<set from DeepSeek /models>"
  temperature: 0.1
  timeout_s: 30
  auditor_timeout_s: 180
  max_retries: 2
  daily_budget_usd: 5.0
  circuit_breaker: {failures: 5, open_minutes: 10}
  # USD per million tokens for every model id above, copied from https://api-docs.deepseek.com/quick_start/pricing
  # (required outside SIM: the daily budget is enforced from these). Example shape:
  #   <model id>: {input_cache_hit_per_mtok: <usd>, input_cache_miss_per_mtok: <usd>, output_per_mtok: <usd>}
  pricing: {}

learning:                      # the self-learning loop (docs/04): penalty-only rules, validated on held-out trades
  enabled: true                 # audits, the rule lifecycle and (with DEEPSEEK_API_KEY) trade reviews and the auditor
  audit_schedule_utc: "00:30"
  audit_min_new_trades: 10
  audit_cooldown_hours: 12
  window_days: 120
  min_matches_total: 20
  min_matches_holdout: 6
  min_effect_r: 0.30
  fdr_q: 0.10
  holdout_fraction: 0.30
  max_rule_conditions: 3
  max_rule_coverage: 0.30
  max_active_rules: 25
  max_total_penalty: 40
  shadow_min_matches: 10
  shadow_max_days: 30
  auto_promote_max_penalty: 15
  review_after_days: 30
  expire_after_days: 90

alerts:
  telegram: false
  daily_summary_utc: "21:05"

research:                     # evidence gates (docs/09 §7). Never lower a gate to let a strategy through.
  holdout_fraction: 0.25      # the most recent quarter of history, evaluated ONCE per hypothesis
  folds: 4                    # anchored walk-forward test windows before the holdout
  min_train_signals: 30
  fdr_q: 0.10                 # Benjamini-Hochberg across every hypothesis in the ledger
  min_oos_signals: 200        # E1: out-of-sample signals needed
  min_positive_fold_share: 0.6
  min_holdout_signals: 60
  min_forward_signals: 100    # E2: shadow signals on live data after the model's training cutoff
  min_paired_signals: 150     # G-LLM: bars where both the analyst and the baseline decided
  max_months_to_evidence: 6   # slower than this to reach E2 = "too slow to validate"
  commission_per_lot: 0       # round turn; Vantage standard accounts charge none (spread only)
  slippage_points: 0
  max_hypotheses_per_run: 5
