# AI Fund OS — trading configuration (schema: backend/src/aifund/config/trading_config.py, docs/02 §4).
# Copy to config/trading.yaml (git-ignored). Unknown keys are rejected; the engine will not start on any
# validation error. Secrets never go here — they belong in .env.

engine:
  account_label: exness-demo-1
  mode: SIM                     # SIM | PAPER | DEMO | LIVE
  allow_live: false             # must be true for LIVE (re-auth in dashboard)
  magic: 26092801
  trading_day_boundary_utc: "21:00"
  timezone_display: "Asia/Kolkata"
  auto_resume_after_crash: false
  bar_close_grace_s: 3
  max_deviation_points: 20

strategy:
  analyst_enabled: true         # false = deterministic baseline only (LLM outage fallback)
  baseline_enabled: false       # deterministic mtf_trend_pullback without LLM (Phase 2)

symbols:
  - canonical: XAUUSD
    broker: XAUUSDm
    asset_class: metal
    profile: intraday_m15
    correlation_bucket: USD_INVERSE
    max_spread_points: 250
    max_spread_to_atr: 0.15
    trade_weekends: false
  - canonical: EURUSD
    broker: EURUSDm
    asset_class: fx
    profile: intraday_m15
    correlation_bucket: USD_INVERSE
    max_spread_points: 20
    max_spread_to_atr: 0.10
    trade_weekends: false
  - canonical: BTCUSD
    broker: BTCUSDm
    asset_class: crypto
    profile: intraday_m15
    correlation_bucket: CRYPTO
    max_spread_to_atr: 0.10
    trade_weekends: true

profiles:
  intraday_m15:
    trigger_tf: M15
    setup_tf: H1
    context_tfs: [H4, D1]
    bars_per_tf: 300
    require_setup: true

risk:
  risk_per_trade_pct: 0.5
  max_risk_per_trade_pct: 1.0
  confidence_threshold: 65
  confidence_risk_scaling: {at_threshold: 0.5, at_90: 1.0}
  vol_regime_scaling: {atr_pct_rank_above: 0.9, factor: 0.5}
  drawdown_scaling: {dd_pct_above: 5.0, factor: 0.5}
  stops:
    atr_tf: trigger
    k_sl_default: 1.5
    k_sl_min: 1.0
    k_sl_max: 3.0
    invalidation_buffer_atr: 0.1
    rr_default: 2.0
    rr_min: 1.2
    rr_max: 4.0
  min_lot_overshoot_pct: 0      # 0 = never upsize to volume_min
  max_lots_per_symbol: 5.0
  commission_per_lot_roundtrip: auto
  max_margin_utilisation: 0.30
  limits:
    max_open_positions: 5
    max_positions_per_symbol: 1
    max_portfolio_heat_pct: 3.0
    max_bucket_heat_pct: 1.5
    max_trades_per_symbol_per_day: 4
    daily_loss_limit_pct: 3.0
    weekly_loss_limit_pct: 6.0
    max_drawdown_pct: 10.0
    max_notional_leverage: 10
  guards:
    cooldown_bars_after_close: 2
    cooldown_bars_after_loss: 4
    block_if_foreign_position_on_symbol: true
    reversal_mode: close_only
    reversal_extra_confidence: 15
    reversal_min_hold_bars: 3
    max_reversals_per_symbol_per_day: 1
    flip_flop_window: 3
    flip_flop_lock_bars: 8
  news:
    enabled: false              # needs the Guardian EA calendar export (Phase 8)
    blackout_minutes_before: 15
    blackout_minutes_after: 15
    impact: [HIGH]

position_management:
  break_even_at_r: null
  trailing: {mode: "off"}
  time_stop_bars: 48
  flatten_friday_utc: "20:30"

llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  analyst_model: "<set from DeepSeek /models>"   # rejected outside SIM until set
  auditor_model: "<set from DeepSeek /models>"
  temperature: 0.1
  timeout_s: 30
  auditor_timeout_s: 180
  max_retries: 2
  daily_budget_usd: 5.0
  circuit_breaker: {failures: 5, open_minutes: 10}

learning:
  audit_schedule_utc: "00:30"
  audit_min_new_trades: 10
  audit_cooldown_hours: 12
  window_days: 120
  min_matches_total: 20
  min_matches_holdout: 6
  min_effect_r: 0.30
  fdr_q: 0.10
  holdout_fraction: 0.30
  max_rule_conditions: 3
  max_rule_coverage: 0.30
  max_active_rules: 25
  max_total_penalty: 40
  shadow_min_matches: 10
  shadow_max_days: 30
  auto_promote_max_penalty: 15
  review_after_days: 30
  expire_after_days: 90

alerts:
  telegram: false
  daily_summary_utc: "21:05"
